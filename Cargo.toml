[package]
name = "virgil-cli"
version = "0.8.1"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
ignore = "0.4"
# 0.26 is required by cersei-tools; `tree-sitter` sets `links = "tree-sitter"`,
# so exactly one version may exist in the graph. The grammar crates below only
# depend on `tree-sitter-language 0.1`, so they are unaffected by the bump.
tree-sitter = "0.26"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-php = "0.24"
rayon = "1.11"
streaming-iterator = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.18"
dirs = "5"
lru = "0.12"
# DuckDB backend. Bundled so we don't depend on a system DuckDB.
duckdb = { version = "1", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-indicatif = "0.3"
# The scan runner drives review agents concurrently on a tokio runtime.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
# Agent SDK. default-features = false drops the `vms` feature (sandboxed VM
# tooling) — the scan agents only need the agent core, providers, and tools.
cersei = { version = "0.2.6", default-features = false }
# Direct deps only because `#[derive(Tool)]` expands to `cersei_tools::…` and
# `#[async_trait::async_trait]`, and neither name is reachable through
# `cersei::prelude::*`. Both are already in the tree via cersei.
cersei-tools = "0.2.6"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
opt-level = 3
codegen-units = 1

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/release/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
# Windows target intentionally not provided — libduckdb-sys's bundled
# DuckDB build hits MSVC stdext::checked_array_iterator removal in
# VS 2026; the regression is upstream and unowned by this repo.
